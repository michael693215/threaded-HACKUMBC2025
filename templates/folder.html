<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>threadedfits — Folder</title>
<style>
  :root { --purple:#5a2d82; --purple-2:#8a2be2; --bg:#f7f7fb; --card:#fff; --muted:#777; }
  * { box-sizing:border-box; }
  body { margin:0; font-family: system-ui, -apple-system, Arial, sans-serif; background:var(--bg); color:#222; }

  .nav { background:#fff; border-bottom:1px solid #eee; padding:18px 16px;
         display:flex; align-items:center; justify-content:space-between; }
  .brand { font-weight:700; color:var(--purple); font-size:22px; }
  .btn { background:#eee; border:none; border-radius:8px; padding:8px 10px; cursor:pointer; text-decoration:none; color:#222; }
  .btn.primary { background: var(--purple-2); color:#fff; }
  .btn.danger { background:#e35c5c; color:#fff; }

  .toolbar { padding:10px 16px; display:flex; align-items:flex-start; gap:12px; }
  .menu { position:relative; }
  .menu-btn {
    display:inline-flex; align-items:center; gap:8px; background: var(--purple-2); color:#fff;
    border:none; border-radius:8px; padding:8px 12px; cursor:pointer; text-decoration:none;
  }
  .menu-btn:hover { filter: brightness(.95); }
  .dropdown {
    position:absolute; top: calc(100% + 6px); left: 0;
    width: min(260px, calc(100vw - 32px)); max-height: 60vh; overflow:auto;
    background:#fff; border:1px solid #eee; border-radius:10px; box-shadow: 0 6px 24px rgba(0,0,0,.08);
    padding:12px; display:none; z-index:1000;
  }
  .dropdown.open { display:block; }
  .menu-list a { display:block; padding:8px 10px; border-radius:8px; text-decoration:none; color:#222; }
  .menu-list a:hover { background:#f2f2f7; }

  main { max-width:1000px; margin:20px auto; padding:0 16px; }
  .header { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:12px; }
  .header h2 { color:var(--purple); margin:0; }
  .upload { display:flex; align-items:center; gap:10px; }
  .upload input[type="file"] { padding:8px; border:1px solid #ddd; border-radius:8px; background:#fff; }

  .grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap:12px; }
  .tile { background:#fff; border:1px solid #eee; border-radius:10px; overflow:hidden; display:flex; flex-direction:column; }
  .tile img { width:100%; height:180px; object-fit:cover; background:#fafafa; }
  .tile .actions { display:flex; gap:8px; padding:8px; justify-content:flex-end; }
  .hint { color:var(--muted); font-size:13px; }
</style>
</head>
<body>
  <header class="nav">
    <div class="brand">Threaded</div>
    <a class="btn" href="/">← Back</a>
  </header>

  <div class="toolbar">
    <nav class="menu"><a class="menu-btn" href="/">Wardrobe</a></nav>
    <nav class="menu">
      <button class="menu-btn" id="outfitsBtn" aria-expanded="false" aria-controls="outfitsDrop">Outfits ▼</button>
      <div class="dropdown" id="outfitsDrop" role="menu" aria-labelledby="outfitsBtn">
        <div class="menu-list">
          <a href="/outfits/create">Create</a>
          <a href="/outfits/saved">Saved Outfits</a>
        </div>
      </div>
    </nav>
    <nav class="menu"><a class="menu-btn" href="/shop">Shop AI</a></nav>
  </div>

  <main>
    <div class="header">
      <h2 id="folderTitle">Folder</h2>
      <div class="upload">
        <input type="file" id="photoUpload" accept="image/*" multiple />
        <button class="btn primary" id="addBtn">Add to this folder</button>
      </div>
    </div>
    <p class="hint">All uploads here are saved locally to this folder only. Backgrounds are removed automatically.</p>
    <section class="grid" id="grid"></section>
  </main>

<script>
  const outfitsBtn = document.getElementById('outfitsBtn');
  const outfitsDrop = document.getElementById('outfitsDrop');
  function toggle(el, open){ el.classList.toggle('open', open!==undefined?open:!el.classList.contains('open')); }
  outfitsBtn.addEventListener('click', (e)=>{ e.stopPropagation(); toggle(outfitsDrop); });
  document.addEventListener('click', ()=>toggle(outfitsDrop,false));

  const LS_V3 = 'threadedfits_state_v3', LS_V2='threadedfits_state_v2';
  function loadState(){
    try{ const r3=localStorage.getItem(LS_V3); if(r3){ const s=JSON.parse(r3); sanitize(s); return s; } }catch{}
    try{ const r2=localStorage.getItem(LS_V2); if(r2){ const s2=JSON.parse(r2); const s3={folders:s2.folders||[], outfits:[]}; sanitize(s3); saveState(s3); return s3; } }catch{}
    const empty={folders:[], outfits:[]}; saveState(empty); return empty;
  }
  function sanitize(s){ if(!Array.isArray(s.folders)) s.folders=[]; if(!Array.isArray(s.outfits)) s.outfits=[];
    s.folders.forEach(f=>{ f.images=(f.images||[]).map(x=>typeof x==='string'?({src:x, ts:Date.now()}):x); });
  }
  function saveState(s){ localStorage.setItem(LS_V3, JSON.stringify(s)); }

  function getParam(name){ return new URL(location.href).searchParams.get(name); }
  let state = loadState();
  const folderId = getParam('id');
  function getFolder(){ return state.folders.find(f => f.id === folderId) || null; }

  const folderTitle = document.getElementById('folderTitle');
  const grid = document.getElementById('grid');
  const fileInput = document.getElementById('photoUpload');
  const addBtn = document.getElementById('addBtn');

  function render(){
    const folder = getFolder();
    if(!folder){ folderTitle.textContent='Folder not found'; grid.innerHTML='<div class="hint">This folder does not exist. Go back and create one.</div>'; addBtn.disabled=true; return; }
    folderTitle.textContent = folder.name;
    grid.innerHTML = '';
    if(!folder.images || !folder.images.length){ const x=document.createElement('div'); x.className='hint'; x.textContent='No items yet. Add some with the button above.'; grid.appendChild(x); return; }

    folder.images.forEach((imgObj, idx) => {
      const src = typeof imgObj === 'string' ? imgObj : imgObj.src;
      const tile = document.createElement('div'); tile.className='tile';
      const img = document.createElement('img'); img.src=src; img.alt=folder.name+' '+(idx+1);
      const actions = document.createElement('div'); actions.className='actions';
      const del = document.createElement('button'); del.className='btn danger'; del.textContent='Delete';
      del.addEventListener('click', () => { const f=getFolder(); if(!f) return; f.images.splice(idx,1); saveState(state); render(); });
      actions.appendChild(del); tile.appendChild(img); tile.appendChild(actions); grid.appendChild(tile);
    });
  }

  // ---- background removal on upload (10s timeout) ----
  async function removeBg(file){
    const fd = new FormData();
    fd.append('file', file);
    const controller = new AbortController();
    const t = setTimeout(()=>controller.abort(), 10000);
    try {
      const resp = await fetch('/api/remove-bg', { method:'POST', body: fd, signal: controller.signal });
      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
      const data = await resp.json();
      if (!data.data_url) throw new Error('no data_url');
      return data.data_url;
    } finally { clearTimeout(t); }
  }
  function fileToDataURL(file){
    return new Promise((res, rej)=>{
      const r=new FileReader(); r.onload=e=>res(e.target.result); r.onerror=rej; r.readAsDataURL(file);
    });
  }

  async function addImagesToFolder(files){
    const folder=getFolder(); if(!folder){ alert('Folder not found.'); return; }
    const list=Array.from(files); if(!list.length){ alert('Select one or more images.'); return; }
    addBtn.disabled = true; const original = addBtn.textContent; addBtn.textContent = 'Processing…';
    for (const file of list){
      let src;
      try { src = await removeBg(file); }
      catch { src = await fileToDataURL(file); }
      folder.images.push({src, ts:Date.now()});
    }
    saveState(state);
    fileInput.value='';
    addBtn.disabled = false; addBtn.textContent = original;
    render();
  }

  addBtn.addEventListener('click', () => addImagesToFolder(fileInput.files));
  render();
</script>
</body>
</html>
