<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>threadedfits — Home</title>
  <style>
    :root { --purple:#5a2d82; --purple-2:#8a2be2; --bg:#f7f7fb; --card:#fff; --muted:#777; }
    * { box-sizing:border-box; }
    body { margin:0; font-family: system-ui, -apple-system, Arial, sans-serif; background:var(--bg); color:#222; }

    /* Header: brand only */
    .nav {
      background:#fff; border-bottom:1px solid #eee; padding:18px 16px;
      display:flex; align-items:center; justify-content:flex-start;
    }
    .brand { font-weight:700; color:var(--purple); font-size:22px; }

    /* Toolbar (below header) */
    .toolbar { padding:10px 16px; display:flex; align-items:flex-start; gap:12px; }
    .menu { position:relative; }
    .menu-btn {
      display:inline-flex; align-items:center; gap:8px; background: var(--purple-2); color:#fff;
      border:none; border-radius:8px; padding:8px 12px; cursor:pointer; text-decoration:none;
    }
    .menu-btn:hover { filter: brightness(.95); }
    .dropdown {
      position:absolute; top: calc(100% + 6px); left: 0;
      width: min(360px, calc(100vw - 32px)); max-height: 60vh; overflow:auto;
      background:#fff; border:1px solid #eee; border-radius:10px; box-shadow: 0 6px 24px rgba(0,0,0,.08);
      padding:12px; display:none; z-index:1000;
    }
    .dropdown.open { display:block; }
    .menu-list a {
      display:block; padding:8px 10px; border-radius:8px; text-decoration:none; color:#222;
    }
    .menu-list a:hover { background:#f2f2f7; }

    .row { display:flex; gap:8px; margin-bottom:10px; }
    .row input[type="text"] { flex:1; padding:8px; border:1px solid #ddd; border-radius:8px; }
    .btn { background:#eee; border:none; border-radius:8px; padding:8px 10px; cursor:pointer; }
    .btn.primary { background: var(--purple-2); color:#fff; }
    .btn.danger { background:#e35c5c; color:#fff; }
    .hint { font-size:12px; color: var(--muted); margin-bottom:6px; }
    .folders { max-height:240px; overflow:auto; border-top:1px dashed #eee; padding-top:8px; }
    .folder-item { display:flex; align-items:center; justify-content:space-between; padding:8px; border:1px solid #eee; border-radius:8px; margin-bottom:6px; background:#fafafa; }
    .folder-name { display:flex; align-items:center; gap:6px; overflow:hidden; }
    .folder-name a { color:#222; text-decoration:none; font-weight:600; white-space:nowrap; text-overflow:ellipsis; overflow:hidden; max-width:180px; }
    .folder-count { color: var(--muted); font-size:12px; }

    /* Page content */
    main { max-width:900px; margin: 8px auto 24px; padding: 0 16px; text-align:center; }
    h1, h2 { color: var(--purple); margin: 12px 0; }
    .upload-section, .posts-section { background:#fff; margin:20px auto; padding:25px; border-radius:8px; box-shadow:0 2px 4px rgba(0,0,0,.1); max-width:700px; }
    .upload-form { display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:center; }
    input[type="file"] { border:1px solid #ddd; padding:10px; border-radius:5px; background:#f9f9f9; }
    select { padding:10px; border:1px solid #ddd; border-radius:6px; }

    /* Carousel */
    .carousel { position:relative; width:100%; max-width:640px; height:420px; margin:0 auto; background:#fafafa; border:1px solid #eee; border-radius:10px; overflow:hidden; display:grid; place-items:center; }
    .carousel img { max-width:100%; max-height:100%; object-fit:contain; display:none; }
    .carousel img.active { display:block; }
    .nav-btn { position:absolute; top:50%; transform:translateY(-50%); background:rgba(0,0,0,0.5); color:#fff; border:none; width:44px; height:44px; border-radius:8px; cursor:pointer; font-size:22px; line-height:44px; display:grid; place-items:center; user-select:none; }
    .nav-btn:hover { background:rgba(0,0,0,0.7); }
    .nav-btn:disabled { opacity:.3; cursor:not-allowed; }
    #prevBtn { left:10px; } #nextBtn { right:10px; }
    .counter { position:absolute; bottom:8px; right:12px; background:rgba(0,0,0,0.5); color:#fff; padding:4px 8px; border-radius:6px; font-size:12px; }
  </style>
</head>
<body>
  <header class="nav"><div class="brand">Threaded</div></header>

  <div class="toolbar">
    <nav class="menu">
      <button class="menu-btn" id="wardrobeBtn" aria-expanded="false" aria-controls="wardrobeDrop">Wardrobe ▼</button>
      <div class="dropdown" id="wardrobeDrop" role="menu" aria-labelledby="wardrobeBtn">
        <div class="hint">Create a folder, then click it to view its items.</div>
        <div class="row">
          <input id="newFolderName" type="text" placeholder="New folder name" />
          <button class="btn primary" id="createFolderBtn">Create</button>
        </div>
        <div class="folders" id="folders"></div>
      </div>
    </nav>

    <nav class="menu">
      <button class="menu-btn" id="outfitsBtn" aria-expanded="false" aria-controls="outfitsDrop">Outfits ▼</button>
      <div class="dropdown" id="outfitsDrop" role="menu" aria-labelledby="outfitsBtn">
        <div class="menu-list">
          <a href="/outfits/create">Create</a>
          <a href="/outfits/saved">Saved Outfits</a>
        </div>
      </div>
    </nav>
  </div>

  <main>
    <h1>Welcome to Threaded!</h1>

    <section class="upload-section">
      <h2>Upload a piece of clothing!</h2>
      <form id="uploadForm" class="upload-form" enctype="multipart/form-data">
        <input type="file" id="photoUpload" name="photo" accept="image/*" multiple />
        <label for="destFolder">Save to:</label>
        <select id="destFolder"></select>
        <button type="submit">Add to wardrobe</button>
      </form>
      <p class="hint">Uploads are saved to the selected folder (stored locally in your browser).</p>
    </section>

    <section class="posts-section">
      <h2>Recently Added</h2>
      <div class="carousel" id="carousel">
        <button class="nav-btn" id="prevBtn" aria-label="Previous image">◀</button>
        <button class="nav-btn" id="nextBtn" aria-label="Next image">▶</button>
        <div class="counter" id="counter">0 / 0</div>
      </div>
    </section>
  </main>

  <script>
    // ---------- Persistence (v3 with outfits) ----------
    const LS_V3 = 'threadedfits_state_v3';
    const LS_V2 = 'threadedfits_state_v2';
    function loadState() {
      try {
        const raw3 = localStorage.getItem(LS_V3);
        if (raw3) { const s=JSON.parse(raw3); sanitizeState(s); return s; }
      } catch {}
      try {
        const raw2 = localStorage.getItem(LS_V2);
        if (raw2) {
          const s2 = JSON.parse(raw2);
          const s3 = { folders: s2.folders || [], outfits: [] };
          sanitizeState(s3); saveState(s3); return s3;
        }
      } catch {}
      const empty = { folders: [], outfits: [] }; saveState(empty); return empty;
    }
    function sanitizeState(s) {
      if (!Array.isArray(s.folders)) s.folders = [];
      if (!Array.isArray(s.outfits)) s.outfits = [];
      s.folders.forEach(f => { f.images = (f.images || []).map(x => typeof x === 'string' ? ({ src:x, ts:Date.now() }) : x); });
    }
    function saveState(s) { localStorage.setItem(LS_V3, JSON.stringify(s)); }
    function uid() { return 'id_' + Math.random().toString(36).slice(2) + Date.now().toString(36); }
    let state = loadState();

    // ---------- Dropdowns ----------
    const wardrobeBtn = document.getElementById('wardrobeBtn');
    const wardrobeDrop = document.getElementById('wardrobeDrop');
    const outfitsBtn  = document.getElementById('outfitsBtn');
    const outfitsDrop = document.getElementById('outfitsDrop');
    function toggle(el, open) { el.classList.toggle('open', open !== undefined ? open : !el.classList.contains('open')); }
    wardrobeBtn.addEventListener('click', (e)=>{ e.stopPropagation(); toggle(wardrobeDrop); toggle(outfitsDrop,false); });
    outfitsBtn.addEventListener('click',  (e)=>{ e.stopPropagation(); toggle(outfitsDrop);  toggle(wardrobeDrop,false); });
    document.addEventListener('click', ()=>{ toggle(wardrobeDrop,false); toggle(outfitsDrop,false); });

    // ---------- Wardrobe list & creation ----------
    const foldersEl = document.getElementById('folders');
    const newFolderNameEl = document.getElementById('newFolderName');
    const createFolderBtn = document.getElementById('createFolderBtn');
    function renderFoldersList() {
      foldersEl.innerHTML = '';
      if (!state.folders.length) { const empty = document.createElement('div'); empty.className='hint'; empty.textContent='No folders yet.'; foldersEl.appendChild(empty); return; }
      state.folders.forEach(f => {
        const row = document.createElement('div'); row.className='folder-item';
        const left = document.createElement('div'); left.className='folder-name';
        const link = document.createElement('a'); link.href='/folder?id='+encodeURIComponent(f.id); link.textContent=f.name;
        const count = document.createElement('span'); count.className='folder-count'; count.textContent=(f.images?.length||0)+' items';
        left.appendChild(link); left.appendChild(count);
        const del = document.createElement('button'); del.className='btn danger'; del.textContent='Delete';
        del.addEventListener('click', (e)=>{ e.preventDefault(); e.stopPropagation();
          if (confirm('Delete folder "'+f.name+'"?')) {
            const i=state.folders.findIndex(x=>x.id===f.id);
            if(i>-1){ state.folders.splice(i,1); saveState(state); renderFoldersList(); renderFolderSelect(); rebuildRecent(); }
          }
        });
        row.appendChild(left); row.appendChild(del); foldersEl.appendChild(row);
      });
    }
    function createFolder(name) {
      const n=(name||'').trim(); if(!n) return;
      state.folders.unshift({ id: uid(), name:n, images:[] });
      saveState(state); renderFoldersList(); renderFolderSelect(); newFolderNameEl.value='';
    }
    createFolderBtn.addEventListener('click', ()=>createFolder(newFolderNameEl.value));
    newFolderNameEl.addEventListener('keydown', (e)=>{ if(e.key==='Enter') createFolder(newFolderNameEl.value); });

    // ---------- Upload -> selected folder ----------
    const uploadForm = document.getElementById('uploadForm');
    const fileInput  = document.getElementById('photoUpload');
    const destFolder = document.getElementById('destFolder');
    function renderFolderSelect() {
      destFolder.innerHTML = '';
      if (!state.folders.length) { const opt=document.createElement('option'); opt.value=''; opt.textContent='— create a folder in Wardrobe —'; destFolder.appendChild(opt); return; }
      state.folders.forEach(f => { const opt=document.createElement('option'); opt.value=f.id; opt.textContent=f.name; destFolder.appendChild(opt); });
    }
    uploadForm.addEventListener('submit', (e)=>{
      e.preventDefault();
      const files=[...fileInput.files]; if(!files.length){ alert('Select image(s).'); return; }
      const fid=destFolder.value; if(!fid){ alert('Create/select a folder first.'); return; }
      const folder=state.folders.find(f=>f.id===fid); if(!folder){ alert('Folder not found.'); return; }
      let remain=files.length;
      files.forEach(file=>{
        const r=new FileReader();
        r.onload = ev => {
          folder.images.push({ src: ev.target.result, ts: Date.now() });
          if(--remain===0){ saveState(state); fileInput.value=''; renderFoldersList(); rebuildRecent(); }
        };
        r.readAsDataURL(file);
      });
    });

    // ---------- Recently Added carousel ----------
    const carousel = document.getElementById('carousel');
    const prevBtn  = document.getElementById('prevBtn');
    const nextBtn  = document.getElementById('nextBtn');
    const counter  = document.getElementById('counter');
    let recent=[]; let currentIndex=0;
    function rebuildRecent() {
      recent = state.folders.flatMap(f => (f.images||[]).map(img => ({ src: img.src || img, ts: img.ts || Date.now() })));
      recent.sort((a,b)=>b.ts-a.ts);
      currentIndex = Math.max(0, Math.min(currentIndex, Math.max(0, recent.length-1)));
      renderCarousel();
    }
    function renderCarousel() {
      [...carousel.querySelectorAll('img')].forEach(n=>n.remove());
      if(!recent.length){ counter.textContent='0 / 0'; prevBtn.disabled=true; nextBtn.disabled=true; return; }
      const img=document.createElement('img'); img.src=recent[currentIndex].src; img.alt='Recent '+(currentIndex+1); img.classList.add('active');
      carousel.insertBefore(img, prevBtn);
      counter.textContent=(currentIndex+1)+' / '+recent.length;
      const multi=recent.length>1; prevBtn.disabled=!multi; nextBtn.disabled=!multi;
    }
    function showPrev(){ if(recent.length<2) return; currentIndex=(currentIndex-1+recent.length)%recent.length; renderCarousel(); }
    function showNext(){ if(recent.length<2) return; currentIndex=(currentIndex+1)%recent.length; renderCarousel(); }
    prevBtn.addEventListener('click', showPrev); nextBtn.addEventListener('click', showNext);
    window.addEventListener('keydown', e=>{ if(e.key==='ArrowLeft') showPrev(); if(e.key==='ArrowRight') showNext(); });

    // Init
    renderFoldersList();
    renderFolderSelect();
    rebuildRecent();
  </script>
</body>
</html>
